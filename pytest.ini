# The ONE pytest config. pytest.ini takes precedence over pyproject.toml, so a
# [tool.pytest.ini_options] block there is silently dead -- one existed, and its
# filterwarnings = ["ignore::DeprecationWarning"] had never once applied. Left
# off rather than switched on here: the suite is clean without it, and silencing
# DeprecationWarnings would hide exactly the pandas/dash upgrade signals worth
# seeing. Add it deliberately if you want it, but add it HERE.
[pytest]
testpaths = tests
pythonpath = .
addopts = -q
